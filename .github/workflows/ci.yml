name: Verify local handoff

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: python -m pip install uv==0.12.17
      - run: uv sync --locked
      - run: npm ci
      - run: npm --prefix apps/web ci --ignore-scripts
      - run: npm --prefix packages/docs-template ci
      - run: python -m unittest discover -s tests -v
      - run: uv run pytest -q
      - run: uv run ruff check services/api scripts
      - run: uv run ruff format --check services/api scripts
      - run: uv run mypy services/api/specbridge
      - run: uv run python scripts/export_openapi.py
      - run: npm --prefix apps/web run generate:types
      - run: git diff --exit-code -- packages/contracts/openapi.json apps/web/src/api/schema.d.ts
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build
      - run: npm --prefix packages/docs-template run build
      - run: npm exec playwright install --with-deps chromium
      - run: npm exec playwright test
      - run: uv run python scripts/verify_handoff.py --output /tmp/specbridge-ci-handoff
      - run: uv run pip-audit
      - run: npm audit --audit-level=high
      - run: npm --prefix apps/web audit --audit-level=high
      - run: npm --prefix packages/docs-template audit --audit-level=moderate
      - run: git show --format= --check HEAD
