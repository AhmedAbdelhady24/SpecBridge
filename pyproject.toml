[project]
name = "specbridge"
version = "0.1.0"
description = "Local, reviewable product-to-engineering handoffs"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "pydantic>=2,<3", "httpx", "pyyaml", "uvicorn"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pip-audit",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "services/api"]
testpaths = ["services/api/tests", "tests/test_bootstrap.py"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

